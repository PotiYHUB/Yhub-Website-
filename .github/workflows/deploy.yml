name: Build and Deploy to cPanel

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      - name: Copy .htaccess to dist
        run: cp public/.htaccess dist/.htaccess 2>/dev/null || cp .htaccess dist/.htaccess 2>/dev/null || true

      - name: Sync Files to cPanel via FTP (Optimized to bypass cPanel/CSF Firewall blocks)
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          # 1. Verification of Secrets
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "::error::Missing deployment secrets! Please make sure FTP_SERVER, FTP_USERNAME, and FTP_PASSWORD are configured in your GitHub Repository under 'Settings > Secrets and variables > Actions'."
            exit 1
          fi

          # Install LFTP client (takes < 2 seconds)
          sudo apt-get update && sudo apt-get install -y lftp
          
          # Clean FTP SERVER string (strip any ftp://, ftps://, sftp:// prefixes, trailing slashes, paths, or :21 port suffixes)
          CLEAN_SERVER=$(echo "$FTP_SERVER" | sed -E 's#^(ftp|ftps|sftp)://##' | sed -E 's#/.*##' | sed -E 's|:[0-9]+$||')
          echo "Connecting to: $CLEAN_SERVER"

          # Deploying using LFTP with deep packet inspection (DPI) friendly configuration.
          # We enable 'debug 10' so we see the exact connection log if it fails.
          lftp <<EOF
          debug 10
          set ftp:ssl-allow no
          set ftp:passive-mode on
          set ftp:nop-interval 15
          set net:timeout 30
          set net:max-retries 2
          open -u "${FTP_USERNAME}","${FTP_PASSWORD}" ftp://${CLEAN_SERVER}:21
          mirror --reverse --delete --verbose=3 ./dist/ /public_html/
          quit
          EOF
