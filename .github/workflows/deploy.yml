name: Build and Deploy to cPanel

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      - name: Copy .htaccess to dist
        run: cp public/.htaccess dist/.htaccess 2>/dev/null || cp .htaccess dist/.htaccess 2>/dev/null || true

      - name: Sync Files to cPanel via FTP (Optimized to bypass cPanel/CSF Firewall blocks)
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          # Install LFTP client (takes < 2 seconds)
          sudo apt-get update && sudo apt-get install -y lftp
          
          # Deploying using LFTP with deep packet inspection (DPI) friendly configuration
          # We use a shell heredoc (EOF) to perfectly handle any special character in passwords safely
          lftp <<EOF
          set ftp:ssl-allow no
          set ftp:passive-mode on
          set ftp:nop-interval 15
          set net:timeout 30
          set net:max-retries 2
          open -u "${FTP_USERNAME}","${FTP_PASSWORD}" ftp://${FTP_SERVER}:21
          mirror --reverse --delete --verbose=3 ./dist/ /public_html/
          quit
          EOF
