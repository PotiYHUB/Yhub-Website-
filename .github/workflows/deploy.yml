name: Build and Deploy to cPanel

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      - name: Copy .htaccess to dist
        run: cp public/.htaccess dist/.htaccess 2>/dev/null || cp .htaccess dist/.htaccess 2>/dev/null || true

      - name: Deploy Compiled Files to Production Branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist # The built static files folder to push
          branch: production # The temporary deployment branch that cPanel tracks
          clean: true # Automatically remove old files no longer in dist

